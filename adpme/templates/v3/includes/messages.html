{% load ui %}
{# ADPME Congo — v3/includes/messages.html — v1 : messages Django (succès, erreur…) #}
{% if messages %}
<div class="container" style="padding-top: var(--sp-5);">
    {% for message in messages %}
    <div class="alert alert--{{ message.tags|default:'info' }}" role="{% if message.tags == 'error' %}alert{% else %}status{% endif %}" data-alerte>
        {% if message.tags == 'success' %}{% icon "check" %}{% else %}{% icon "info" %}{% endif %}
        <p>{{ message }}</p>
        <button type="button" class="alert__fermer" data-alerte-fermer aria-label="Fermer ce message">{% icon "fermer" %}</button>
    </div>
    {% endfor %}
</div>
{% endif %}
